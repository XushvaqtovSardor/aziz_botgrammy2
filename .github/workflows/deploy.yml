name: deploy CI/CD project
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy over SSH and run Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            PROJECT_DIR="aziz_botgrammy2"
            REPO_URL="https://github.com/XushvaqtovSardor/aziz_botgrammy2.git"

            echo "Creating project folder if it doesn't exist!"
            mkdir -p /root
            cd /root

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Cloning repository!" 
              git clone "$REPO_URL" "$PROJECT_DIR"
            else
              echo "Pulling latest changes!"
              cd "$PROJECT_DIR"
              git pull origin main  
            fi

            cd "$PROJECT_DIR"

            echo "Stopping containers"
            docker compose down

            echo "Building containers"
            docker compose build 

            echo "Running containers"
            docker compose up -d
