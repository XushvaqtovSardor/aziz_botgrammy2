version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: aziz_bot_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - bot-network

  grafana:
    image: grafana/grafana:latest
    container_name: aziz_bot_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - bot-network
    depends_on:
      - prometheus

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: aziz_bot_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-12345}@${DB_HOST:-db}:5432/${DB_NAME:-aziz_db}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - bot-network
    depends_on:
      - db

volumes:
  prometheus_data:
  grafana_data:
